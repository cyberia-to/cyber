<text x="126" y="712" font-family="'JetBrains Mono','Courier New',monospace" font-size="32" font-weight="700" fill="#FF2ED2">no one knows who said what,</text>
<text x="126" y="766" font-family="'JetBrains Mono','Courier New',monospace" font-size="32"><tspan fill="#E9F6F1">and yet </tspan><tspan fill="#00FFC2" font-weight="700">everyone knows what everyone said.</tspan></text>
<text x="126" y="872" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#66798A" font-weight="400" letter-spacing="3" text-anchor="start" opacity="1">neurons · particles · cyberlinks · φ*</text>

