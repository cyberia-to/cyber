<text x="126" y="478" font-family="'JetBrains Mono','Courier New',monospace" font-size="40" fill="#E9F6F1" font-weight="400" letter-spacing="2" text-anchor="start" opacity="1">a protocol for collective focus</text>
<text x="126" y="590" font-family="'JetBrains Mono','Courier New',monospace" font-size="32" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">The machine into which anyone may speak</text>
