<line x1="80" y1="92" x2="1840" y2="92" stroke="#15303B" stroke-width="1.5"/><line x1="80" y1="988" x2="1840" y2="988" stroke="#15303B" stroke-width="1.5"/><text x="80" y="66" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#00FFC2" font-weight="700" letter-spacing="6" text-anchor="start" opacity="1">02  ·  DIAGNOSIS</text><text x="1840" y="66" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#66798A" font-weight="400" letter-spacing="6" text-anchor="end" opacity="1">VALUE vs MEANING</text><text x="80" y="1028" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#66798A" font-weight="400" letter-spacing="6" text-anchor="start" opacity="1">THE WORLD BUILT A PUBLIC LEDGER FOR COINS</text><text x="1840" y="1028" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#66798A" font-weight="400" letter-spacing="4" text-anchor="end" opacity="1">02 / 09</text>
<text x="120" y="205" font-family="'JetBrains Mono','Courier New',monospace" font-size="54" fill="#E9F6F1" font-weight="700" letter-spacing="0" text-anchor="start" opacity="1">Two ledgers. One public. One private.</text>
<rect x="120" y="300" width="820" height="560" rx="10" fill="#0A121C" stroke="#00FFC2" stroke-width="2" filter="url(#glow)" opacity="0.97"/>
<text x="170" y="380" font-family="'JetBrains Mono','Courier New',monospace" font-size="34" fill="#00FFC2" font-weight="700" letter-spacing="6" text-anchor="start" opacity="1">VALUE</text>
<text x="170" y="428" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#66798A" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">public ledger for coins — solved</text>
<text x="170" y="510" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">A transfer of value settles without a bank.</text><text x="170" y="550.3" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1"></text><text x="170" y="590.6" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Permissionless. Final. Content-addressed.</text><text x="170" y="630.9" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Anyone can verify. No gatekeeper.</text><text x="170" y="671.2" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1"></text><text x="170" y="711.5" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">The ledger is the shared ground truth.</text>
<rect x="980" y="300" width="820" height="560" rx="10" fill="#0A121C" stroke="#FF2ED2" stroke-width="2" filter="url(#glow)" opacity="0.97"/>
<text x="1030" y="380" font-family="'JetBrains Mono','Courier New',monospace" font-size="34" fill="#FF2ED2" font-weight="700" letter-spacing="6" text-anchor="start" opacity="1">MEANING</text>
<text x="1030" y="428" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#66798A" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">still rents its rank — private</text>
<text x="1030" y="510" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Understanding still rents its rank from</text><text x="1030" y="550.3" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">whoever owns the feed and the weight file —</text><text x="1030" y="590.6" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">trained on everyone, for free.</text><text x="1030" y="630.9" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1"></text><text x="1030" y="671.2" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Unanswered: what deserves attention, who</text><text x="1030" y="711.5" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">taught the pattern, who is paid when the</text><text x="1030" y="751.8" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">shared picture sharpens.</text>

</svg>