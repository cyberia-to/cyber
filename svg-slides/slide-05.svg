<text x="1030" y="440" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Separate work. No capital at risk.</text><text x="1030" y="480.3" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1"></text><text x="1030" y="520.6" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Mining samples the Shapley value of</text><text x="1030" y="560.9" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">contributors to a focus shift and folds</text><text x="1030" y="601.2" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">the proofs into a constant-size</text><text x="1030" y="641.5" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">mint claim.</text>
