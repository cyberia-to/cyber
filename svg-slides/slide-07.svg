38" y="420" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Every particle and link is</text><text x="1338" y="454.8" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">cryptographically bound.</text><rect x="120" y="580" width="540" height="260" rx="10" fill="#0A121C" stroke="#00FFC2" stroke-width="2" opacity="0.97"/><circle cx="178" cy="642" r="9" fill="#00FFC2" filter="url(#glow)"/><text x="208" y="652" font-family="'JetBrains Mono','Courier New',monospace" font-size="27" fill="#00FFC2" font-weight="700" letter-spacing="3" text-anchor="start" opacity="1">PRIVACY BY DEFAULT</text><text x="178" y="720" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">A neuron may speak without</text><text x="178" y="754.8" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">fear of retribution.</text><rect x="700" y="580" width="540" height="260" rx="10" fill="#0A121C" stroke="#3EC9FF" stroke-width="2" opacity="0.97"/><circle cx="758" cy="642" r="9" fill="#3EC9FF" filter="url(#glow)"/><text x="788" y="652" font-family="'JetBrains Mono','Courier New',monospace" font-size="27" fill="#3EC9FF" font-weight="700" letter-spacing="3" text-anchor="start" opacity="1">NEURAL AS LANGUAGE</text><text x="758" y="720" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">The graph speaks the language</text><text x="758" y="754.8" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">of neurons, not schemas.</text><rect x="1280" y="580" width="540" height="260" rx="10" fill="#0A121C" stroke="#FF2ED2" stroke-width="2" opacity="0.97"/><circle cx="1338" cy="642" r="9" fill="#FF2ED2" filter="url(#glow)"/><text x="1368" y="652" font-family="'JetBrains Mono','Courier New',monospace" font-size="27" fill="#FF2ED2" font-weight="700" letter-spacing="3" text-anchor="start" opacity="1">OPEN SURFACE</text><text x="1338" y="720" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">No schema gatekeeper. Entry</text><text x="1338" y="754.8" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">by stake and work, not permission.</text>
