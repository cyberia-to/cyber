l="#66798A" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Agreement propagates by gossip — not a global vote.</text><rect x="1000" y="750" width="800" height="140" rx="10" fill="#0A121C" stroke="#15303B" stroke-width="2" opacity="0.97"/><circle cx="1062" cy="820" r="30" fill="none" stroke="#00FFC2" stroke-width="2.5" filter="url(#glow)"/><text x="1062" y="830" font-family="'JetBrains Mono','Courier New',monospace" font-size="28" fill="#00FFC2" font-weight="700" letter-spacing="0" text-anchor="middle" opacity="1">4</text><text x="1120" y="808" font-family="'JetBrains Mono','Courier New',monospace" font-size="26" fill="#E9F6F1" font-weight="700" letter-spacing="4" text-anchor="start" opacity="1">LIGHT-DELAY SURVIVAL</text><text x="1120" y="850" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#66798A" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Shared facts survive light-minutes of delay between worlds.</text>

