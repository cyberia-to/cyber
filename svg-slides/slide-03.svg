font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Content-addressed atoms of meaning.</text><text x="1050" y="393.05" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Immutable once published. Identified by</text><text x="1050" y="424.1" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">hash, not host. No schema gatekeeper.</text><rect x="1000" y="470" width="800" height="180" rx="10" fill="#0A121C" stroke="#FF2ED2" stroke-width="2" opacity="0.97"/><text x="1050" y="528" font-family="'JetBrains Mono','Courier New',monospace" font-size="30" fill="#FF2ED2" font-weight="700" letter-spacing="5" text-anchor="start" opacity="1">CYBERLINKS</text><text x="1050" y="572" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Signed. Weighted. Staked. A public,</text><text x="1050" y="603.05" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">priced act of judgment: this relates</text><text x="1050" y="634.1" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">to that. A wrong claim costs the staker.</text><rect x="1000" y="680" width="800" height="180" rx="10" fill="#0A121C" stroke="#3EC9FF" stroke-width="2" opacity="0.97"/><text x="1050" y="738" font-family="'JetBrains Mono','Courier New',monospace" font-size="30" fill="#3EC9FF" font-weight="700" letter-spacing="5" text-anchor="start" opacity="1">NEURONS</text><text x="1050" y="782" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Agents that hold keys, stake, work and karma —</text><text x="1050" y="813.05" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">human or machine. The only writers.</text><text x="1050" y="844.1" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Entry by stake and work, not permission.</text>

