ext-anchor="start" opacity="1">The protocol holds its own identity, capital</text><text x="1050" y="435.05" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">and reputation — a peer among peers that</text><text x="1050" y="466.1" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">links and holds treasury.</text><rect x="1000" y="515" width="800" height="185" rx="10" fill="#0A121C" stroke="#3EC9FF" stroke-width="2" opacity="0.97"/><text x="1050" y="573" font-family="'JetBrains Mono','Courier New',monospace" font-size="28" fill="#3EC9FF" font-weight="700" letter-spacing="4" text-anchor="start" opacity="1">RETUNES FROM φ*</text><text x="1050" y="619" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">Parameters, treasury and codebase settle in</text><text x="1050" y="650.05" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">the same consensus as every other claim.</text><rect x="1000" y="730" width="800" height="185" rx="10" fill="#0A121C" stroke="#FF2ED2" stroke-width="2" opacity="0.97"/><text x="1050" y="788" font-family="'JetBrains Mono','Courier New',monospace" font-size="28" fill="#FF2ED2" font-weight="700" letter-spacing="4" text-anchor="start" opacity="1">STEERED BY ALL WHO TEACH</text><text x="1050" y="834" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">The development vector is the collective focus</text><text x="1050" y="865.05" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">of everyone who teaches the graph —</text><text x="1050" y="896.1" font-family="'JetBrains Mono','Courier New',monospace" font-size="23" fill="#E9F6F1" font-weight="400" letter-spacing="0" text-anchor="start" opacity="1">not a foundation, not a founder.</text>

