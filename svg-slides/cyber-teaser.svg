<text x="120" y="66" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#00FFC2" font-weight="700" letter-spacing="10" text-anchor="start" opacity="1">CYBER</text>
<text x="1800" y="66" font-family="'JetBrains Mono','Courier New',monospace" font-size="22" fill="#66798A" font-weight="400" letter-spacing="6" text-anchor="end" opacity="1">A PROTOCOL FOR COLLECTIVE FOCUS</text>
<text x="960" y="320" font-family="'JetBrains Mono','Courier New',monospace" font-size="52" fill="#E9F6F1" font-weight="700" letter-spacing="0" text-anchor="middle" opacity="1">The machine into which anyone may speak</text>
<text x="960" y="405" font-family="'JetBrains Mono','Courier New',monospace" font-size="52" fill="#E9F6F1" font-weight="700" letter-spacing="0" text-anchor="middle" opacity="1">and be rewarded for truth —</text>
<text x="960" y="560" font-family="'JetBrains Mono','Courier New',monospace" font-size="54" font-weight="700" text-anchor="middle" fill="#FF2ED2" filter="url(#glow)">no one knows who said what,</text>
<text x="960" y="640" font-family="'JetBrains Mono','Courier New',monospace" font-size="34" fill="#66798A" font-weight="400" letter-spacing="0" text-anchor="middle" opacity="1">and yet</text>
<text x="960" y="740" font-family="'JetBrains Mono','Courier New',monospace" font-size="54" font-weight="700" text-anchor="middle" fill="#00FFC2" filter="url(#glow)">everyone knows what everyone said.</text>
<text x="960" y="936" font-family="'JetBrains Mono','Courier New',monospace" font-size="24" fill="#66798A" font-weight="400" letter-spacing="8" text-anchor="middle" opacity="1">SPEAK WITHOUT FEAR  ·  KNOW WITHOUT PERMISSION</text>

