name: Publish

on:
  push:
    branches:
      - master

jobs:
  publish-cyber:
    runs-on: ubuntu-latest
    environment: cyber
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache IPFS mappings
        uses: actions/cache@v4
        with:
          path: .ipfs-cache.json
          key: ipfs-${{ github.run_id }}
          restore-keys: ipfs-

      - name: Upload images to IPFS
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
        run: |
          if [ -z "$PINATA_JWT" ]; then
            echo "PINATA_JWT not set, skipping IPFS upload"
            exit 0
          fi

          # Load cached IPFS mappings (asset path + sha256 → IPFS URL)
          if [ ! -f .ipfs-cache.json ]; then
            echo '{}' > .ipfs-cache.json
          fi

          ASSETS=$(grep -roh 'assets/[^)]*\.\(png\|jpg\|jpeg\|gif\|webp\|svg\)' pages/ journals/ --include="*.md" 2>/dev/null | sort -u || true)
          if [ -z "$ASSETS" ]; then
            echo "No image assets to upload"
            exit 0
          fi

          TOTAL=$(echo "$ASSETS" | wc -l | tr -d ' ')
          SKIPPED=0
          UPLOADED=0

          for asset in $ASSETS; do
            if [ ! -f "$asset" ]; then
              continue
            fi

            # Check cache by file content hash
            HASH=$(sha256sum "$asset" | cut -d' ' -f1)
            CACHED_URL=$(jq -r --arg h "$HASH" '.[$h] // empty' .ipfs-cache.json)

            if [ -n "$CACHED_URL" ]; then
              # Already pinned — just rewrite URLs in markdown
              find pages/ journals/ -name "*.md" -exec sed -i "s|${asset}|${CACHED_URL}|g" {} +
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Upload to Pinata
            RESPONSE=$(curl -s -X POST "https://api.pinata.cloud/pinning/pinFileToIPFS" \
              -H "Authorization: Bearer $PINATA_JWT" \
              -F "file=@$asset")
            CID=$(echo "$RESPONSE" | jq -r '.IpfsHash // empty')
            if [ -n "$CID" ]; then
              IPFS_URL="${PINATA_GATEWAY}/ipfs/${CID}"
              find pages/ journals/ -name "*.md" -exec sed -i "s|${asset}|${IPFS_URL}|g" {} +
              # Update cache
              jq --arg h "$HASH" --arg u "$IPFS_URL" '.[$h] = $u' .ipfs-cache.json > .ipfs-cache.tmp && mv .ipfs-cache.tmp .ipfs-cache.json
              echo "  $asset → $IPFS_URL"
              UPLOADED=$((UPLOADED + 1))
            else
              echo "  WARNING: Failed to upload $asset"
            fi
          done

          echo "IPFS: $TOTAL assets, $SKIPPED cached, $UPLOADED uploaded"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            src/publish/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/publish/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build site
        run: cd src/publish && cargo run --release -- build ../.. --base-url "https://cyber.page"

      - name: Add deploy files
        run: |
          touch public/.nojekyll
          # Copy logo if exists
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png public/
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          cd public && zip -qr /tmp/deploy.zip . && cd ..
          echo "Deploying $(du -sh /tmp/deploy.zip | cut -f1) zip to Netlify..."
          RESPONSE=$(curl -s -X POST \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys" \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/deploy.zip)
          STATE=$(echo "$RESPONSE" | jq -r '.state // .error // "unknown"')
          URL=$(echo "$RESPONSE" | jq -r '.ssl_url // .url // empty')
          echo "Deploy state: $STATE"
          if [ -n "$URL" ]; then
            echo "URL: $URL"
          fi
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            echo "Error: $(echo "$RESPONSE" | jq -r '.message // .error')"
            exit 1
          fi
