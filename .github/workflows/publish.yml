name: Publish

on:
  push:
    branches: [master]
    paths:
      - '**.md'
      - 'publish.toml'
      - '_redirects'
      - 'scripts/build.nu'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [content-changed]

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone cyber
        run: |
          mkdir -p "$HOME/cyber"
          git clone --depth 1 https://github.com/cyberia-to/cyber.git "$HOME/cyber/cyber"

      - name: Clone the census (cyberia-blog/subgraphs.toml)
        run: |
          git clone --depth 1 https://github.com/cyberia-to/cyberia-blog.git "$HOME/cyber/cyberia-blog"

      - name: Install Nushell
        run: |
          NU_TAG=$(curl -fsSL https://api.github.com/repos/nushell/nushell/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          NU_VER="${NU_TAG#v}"
          ARCHIVE="nu-${NU_VER}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "https://github.com/nushell/nushell/releases/download/${NU_TAG}/${ARCHIVE}" -o /tmp/nu.tar.gz
          tar -xzf /tmp/nu.tar.gz -C /tmp
          sudo cp "/tmp/nu-${NU_VER}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/nu
          nu --version

      # cyber.page is the protocol pages at the root plus every public subgraph
      # of the census, so each wiki-link resolves exactly as on localhost.
      - name: Clone public subgraphs from the census
        run: |
          cd "$HOME/cyber/cyberia-blog"
          nu -c '
            let decls = (open subgraphs.toml | get subgraph)
            $decls
            | where {|d| ($d.name? | default "") != "cyber"}
            | where {|d| ($d.name? | default "") != "cyberia-blog"}
            | where {|d| ($d.archived? | default false) != true}
            | where {|d| ($d.orphan? | default false) != true}
            | where {|d| ($d."local-only"? | default false) != true}
            | where {|d| ($d.visibility? | default "public") == "public"}
            | each {|d|
              let name = $d.name
              let repo = ($d.repo? | default $d.name)
              let target = $"($env.HOME)/cyber/($name)"
              if not ($target | path exists) {
                print $"Cloning ($name) from ($repo)..."
                let url = $"https://github.com/cyberia-to/($repo).git"
                try {
                  ^git clone --depth 1 $url $target
                } catch {|e|
                  print $"skip ($name): ($e.msg)"
                }
              }
            }
          '

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Cache optica build
        uses: actions/cache@v4
        with:
          path: |
            /tmp/optica-target-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-optica-v4

      - name: Build optica
        run: |
          rm -rf "$HOME/cyber/optica"
          git clone --depth 1 https://github.com/cyberia-to/optica.git "$HOME/cyber/optica"
          if [ -d /tmp/optica-target-cache ]; then
            mv /tmp/optica-target-cache "$HOME/cyber/optica/target"
          fi
          cd "$HOME/cyber/optica" && cargo build --release
          cp -r "$HOME/cyber/optica/target" /tmp/optica-target-cache

      - name: Build site
        run: |
          cd "$HOME/cyber/cyber"
          nu scripts/build.nu --public-only \
            --census "$HOME/cyber/cyberia-blog/subgraphs.toml" \
            --optica "$HOME/cyber/optica/target/release/optica" \
            --output "$HOME/cyber/cyber/build"
          touch "$HOME/cyber/cyber/build/.nojekyll"
          test -f "$HOME/cyber/cyber/build/litepaper/index.html"

      # The litepaper must funnel: a yellow (stub) link there is a failed build.
      - name: Gate — litepaper links resolve
        run: |
          stubs=$(grep -o 'class="internal-link stub-link" data-page="[^"]*"' "$HOME/cyber/cyber/build/litepaper/index.html" | sed 's/.*data-page=//' | sort -u || true)
          echo "unresolved litepaper links: $stubs"
          count=$(printf "%s" "$stubs" | grep -c . || true)
          test "$count" -eq 0

      # File-digest deploy: 14k files / ~440 MB is past the zip API's comfort
      # zone (25,000-file cap, 30 s request limit); the CLI uploads only files
      # whose digest changed since the last deploy.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          cd "$HOME/cyber/cyber"
          echo "files: $(find build -type f | wc -l)  size: $(du -sh build | cut -f1)"
          npx -y netlify-cli@27.12.0 deploy --prod --no-build \
            --dir "$HOME/cyber/cyber/build" \
            --message "cyber ${GITHUB_SHA::8}" \
            --timeout 1800

      - name: Dispatch cyberia-blog rebuild
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CYBER_DISPATCH_TOKEN }}
          repository: cyberia-to/cyberia-blog
          event-type: content-changed
