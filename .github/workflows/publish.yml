name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish-cyber:
    runs-on: ubuntu-latest
    environment: cyber
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout subgraph repos
        run: |
          # Scan graph pages for subgraph declarations and clone from the same org
          ORG="cyberia-to"
          for f in graph/*.md; do
            if grep -q '^subgraph: true' "$f" 2>/dev/null; then
              REPO_REL=$(grep '^repo:' "$f" | head -1 | sed 's/^repo: *//')
              if [ -n "$REPO_REL" ]; then
                REPO_NAME=$(basename "$REPO_REL")
                TARGET_DIR=$(cd "$(dirname "$f")/.." && pwd)/"$REPO_REL"
                TARGET_DIR=$(realpath -m "$TARGET_DIR")
                if [ ! -d "$TARGET_DIR" ]; then
                  echo "Cloning $ORG/$REPO_NAME → $TARGET_DIR"
                  git clone --depth 1 "https://github.com/$ORG/$REPO_NAME.git" "$TARGET_DIR"
                fi
              fi
            fi
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            render/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('render/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache IPFS CIDs
        uses: actions/cache@v4
        with:
          path: ipfs-cache.json
          key: ipfs-cids-${{ github.run_id }}
          restore-keys: ipfs-cids-

      - name: Resolve IPFS media
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
        run: |
          PUBLIC_GATEWAY="https://gateway.pinata.cloud"
          if [ -n "$PINATA_GATEWAY" ]; then
            GATEWAY="$PINATA_GATEWAY"
          else
            GATEWAY="$PUBLIC_GATEWAY"
          fi

          # Load cache from previous runs
          CACHE_FILE="ipfs-cache.json"
          if [ ! -f "$CACHE_FILE" ]; then
            echo '{}' > "$CACHE_FILE"
          fi

          # Collect unique media filenames from markdown (refs use ../media/file)
          FILENAMES=$(grep -roh '\.\./media/[^)"'"'"' ]*' pages/ | sed 's|\.\./media/||' | sort -u || true)
          if [ -z "$FILENAMES" ]; then
            echo "No media references found"
            # Prune entire cache if no references remain
            BEFORE=$(jq 'length' "$CACHE_FILE")
            if [ "$BEFORE" -gt 0 ]; then
              echo '{}' > "$CACHE_FILE"
              echo "Pruned all $BEFORE stale entries from cache"
            fi
            exit 0
          fi

          COUNT=$(echo "$FILENAMES" | wc -l | tr -d ' ')
          echo "Found $COUNT unique media references"

          GATEWAY_TESTED=false
          SED_SCRIPT=""
          UPLOADED=0
          CACHED=0

          while IFS= read -r filename; do
            [ -z "$filename" ] && continue

            # Check cache first
            CID=$(jq -r --arg f "$filename" '.[$f] // empty' "$CACHE_FILE")

            if [ -n "$CID" ]; then
              CACHED=$((CACHED + 1))
            else
              # Not in cache — need to upload
              if [ -z "$PINATA_JWT" ]; then
                echo "  SKIP: $filename (no JWT, not in cache)"
                continue
              fi
              if [ ! -f "media/$filename" ]; then
                echo "  SKIP: $filename (not in cache, file not found)"
                continue
              fi
              echo "  Uploading media/$filename..."
              RESP=$(curl -s -X POST \
                "https://api.pinata.cloud/pinning/pinFileToIPFS" \
                -H "Authorization: Bearer ${PINATA_JWT}" \
                -F "file=@media/${filename}")
              CID=$(echo "$RESP" | jq -r '.IpfsHash // empty')
              if [ -z "$CID" ]; then
                echo "  WARNING: Failed to upload $filename: $(echo "$RESP" | jq -r '.error // .message // "unknown"')"
                continue
              fi
              # Add to cache
              jq --arg f "$filename" --arg c "$CID" '. + {($f): $c}' "$CACHE_FILE" > tmp.json && mv tmp.json "$CACHE_FILE"
              UPLOADED=$((UPLOADED + 1))
            fi

            # Test gateway once with first CID
            if [ "$GATEWAY_TESTED" = false ] && [ "$GATEWAY" != "$PUBLIC_GATEWAY" ]; then
              HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$GATEWAY/ipfs/$CID")
              if [ "$HTTP_CODE" != "200" ]; then
                echo "Custom gateway returned $HTTP_CODE, falling back to public"
                GATEWAY="$PUBLIC_GATEWAY"
              else
                echo "Custom gateway OK"
              fi
              GATEWAY_TESTED=true
            fi

            IPFS_URL="${GATEWAY}/ipfs/${CID}"
            SED_SCRIPT="${SED_SCRIPT}s|\.\./media/${filename}|${IPFS_URL}|g;"
          done <<< "$FILENAMES"

          echo "Cached: $CACHED, Uploaded: $UPLOADED"

          # Prune cache: remove entries no longer referenced in pages
          BEFORE=$(jq 'length' "$CACHE_FILE")
          KEEP_FILTER="{"
          while IFS= read -r filename; do
            [ -z "$filename" ] && continue
            KEEP_FILTER="${KEEP_FILTER}\"${filename}\": .\"${filename}\","
          done <<< "$FILENAMES"
          KEEP_FILTER="${KEEP_FILTER}}"
          # Build jq filter that keeps only referenced keys
          jq --argjson keys "$(echo "$FILENAMES" | jq -R -s 'split("\n") | map(select(length > 0))')" \
            'with_entries(select(.key as $k | $keys | index($k)))' "$CACHE_FILE" > tmp.json && mv tmp.json "$CACHE_FILE"
          AFTER=$(jq 'length' "$CACHE_FILE")
          PRUNED=$((BEFORE - AFTER))
          if [ "$PRUNED" -gt 0 ]; then
            echo "Pruned $PRUNED stale entries from cache ($BEFORE → $AFTER)"
          fi

          if [ -n "$SED_SCRIPT" ]; then
            find pages/ -name '*.md' -exec sed -i "$SED_SCRIPT" {} +
            echo "Rewrote media URLs using $GATEWAY"
          fi

      - name: Build site
        run: cd render && cargo run --release -- build .. --base-url "https://cyber.page"

      - name: Add deploy files
        run: touch build/.nojekyll

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          cd build && zip -qr /tmp/deploy.zip . && cd ..
          echo "Deploying $(du -sh /tmp/deploy.zip | cut -f1) zip to Netlify..."
          RESPONSE=$(curl -s -X POST \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys" \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/deploy.zip)
          STATE=$(echo "$RESPONSE" | jq -r '.state // .error // "unknown"')
          URL=$(echo "$RESPONSE" | jq -r '.ssl_url // .url // empty')
          echo "Deploy state: $STATE"
          if [ -n "$URL" ]; then
            echo "URL: $URL"
          fi
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            echo "Error: $(echo "$RESPONSE" | jq -r '.message // .error')"
            exit 1
          fi
