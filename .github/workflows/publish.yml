# ---
# tags: cyber, config
# crystal-type: source
# crystal-domain: cyber
# ---
# Deployment orchestration moved to cyberia-to/.github per SPEC.md.
# On push to master, fire a repository_dispatch at the workspace repo
# so the workspace's publish workflow rebuilds the full graph.
#
# Requires a repo secret WORKSPACE_DISPATCH_TOKEN — a PAT (classic or
# fine-grained) with `repo:public_repo` scope on cyberia-to/.github.
# Without it this step no-ops and the workspace rebuilds on its own
# push/schedule/manual triggers.
name: Notify workspace

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch at cyberia-to/.github
        env:
          TOKEN: ${{ secrets.WORKSPACE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "WORKSPACE_DISPATCH_TOKEN not set; skipping. Publish workflow"
            echo "in cyberia-to/.github can still be triggered manually."
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cyberia-to/.github/dispatches \
            -d '{"event_type":"content-changed","client_payload":{"source":"cyber","sha":"${{ github.sha }}"}}'
          echo "Dispatched content-changed to cyberia-to/.github"
