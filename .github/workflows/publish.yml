name: Publish Sites

on:
  push:
    branches:
      - master

jobs:
  publish-cyber:
    runs-on: ubuntu-latest
    environment: cyber
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload images to IPFS
        if: ${{ secrets.PINATA_JWT != '' }}
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
        run: |
          # Find markdown files referencing local assets
          ASSET_REFS=$(grep -rl 'assets/' pages/ journals/ --include="*.md" 2>/dev/null || true)
          if [ -z "$ASSET_REFS" ]; then
            echo "No local asset references found, skipping IPFS upload"
            exit 0
          fi

          # Find unique asset files referenced in markdown
          ASSETS=$(grep -roh 'assets/[^)]*\.\(png\|jpg\|jpeg\|gif\|webp\|svg\)' pages/ journals/ --include="*.md" 2>/dev/null | sort -u || true)
          if [ -z "$ASSETS" ]; then
            echo "No image assets to upload"
            exit 0
          fi

          echo "Uploading $(echo "$ASSETS" | wc -l) assets to IPFS..."
          for asset in $ASSETS; do
            if [ -f "$asset" ]; then
              RESPONSE=$(curl -s -X POST "https://api.pinata.cloud/pinning/pinFileToIPFS" \
                -H "Authorization: Bearer $PINATA_JWT" \
                -F "file=@$asset")
              HASH=$(echo "$RESPONSE" | jq -r '.IpfsHash // empty')
              if [ -n "$HASH" ]; then
                IPFS_URL="${PINATA_GATEWAY}/ipfs/${HASH}"
                # Replace local path with IPFS URL in all markdown files
                find pages/ journals/ -name "*.md" -exec sed -i "s|${asset}|${IPFS_URL}|g" {} +
                echo "  $asset → $IPFS_URL"
              else
                echo "  WARNING: Failed to upload $asset"
              fi
            fi
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            src/publish/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/publish/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build site
        run: cd src/publish && cargo run --release -- build ../.. --base-url "https://cyber.page"

      - name: Add deploy files
        run: |
          touch public/.nojekyll
          # Copy logo if exists
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png public/
          fi

      - name: Inject analytics
        if: ${{ secrets.PLAUSIBLE_SCRIPT_ID != '' }}
        env:
          PLAUSIBLE_SCRIPT_ID: ${{ secrets.PLAUSIBLE_SCRIPT_ID }}
        run: |
          SCRIPT_TAG="<script defer data-domain=\"cyber.page\" src=\"https://plausible.io/js/script.js\" data-api=\"https://plausible.io/api/event\"></script>"
          find public -name "*.html" -exec sed -i "s|</head>|${SCRIPT_TAG}</head>|" {} +

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --dir=public --prod

  publish-cvland:
    runs-on: ubuntu-latest
    environment: cvland
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            src/publish/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/publish/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build site
        run: cd src/publish && cargo run --release -- build ../.. --base-url "https://cv.land"

      - name: Add deploy files
        run: touch public/.nojekyll

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --dir=public --prod
