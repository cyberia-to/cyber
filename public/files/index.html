<script>
    (function () {
        var toggle = document.querySelector(
            ".sidebar-toggle",
        );
        var sidebar = document.querySelector(".sidebar");
        if (toggle && sidebar) {
            toggle.addEventListener("click", function () {
                var expanded =
                    toggle.getAttribute("aria-expanded") ===
                    "true";
                toggle.setAttribute(
                    "aria-expanded",
                    !expanded,
                );
                sidebar.classList.toggle("open");
            });
        }

        var path = window.location.pathname;
        document
            .querySelectorAll(".sidebar-menu a")
            .forEach(function (a) {
                var href = a.getAttribute("href");
                if (
                    href &&
                    href !== "/" &&
                    path.startsWith(href)
                ) {
                    a.classList.add("active");
                }
            });
    })();
</script>

        <script>
            document.addEventListener(
                "DOMContentLoaded",
                function () {
                    // Unescape HTML entities inside math delimiters before KaTeX processes them
                    // comrak escapes > to &gt;, < to &lt;, etc. which breaks LaTeX
                    var content =
                        document.querySelector(
                            ".main-content",
                        );
                    if (!content) return;
                    var walker = document.createTreeWalker(
                        content,
                        NodeFilter.SHOW_TEXT,
                        null,
                        false,
                    );
                    while (walker.nextNode()) {
                        var node = walker.currentNode;
                        if (
                            node.nodeValue &&
                            /\$/.test(node.nodeValue)
                        ) {
                            var text = node.nodeValue;
                            // Fix HTML entities inside $...$ and $$...$$
                            text = text.replace(
                                /\$\$([^$]+)\$\$/g,
                                function (m, inner) {
                                    return (
                                        "$$" +
                                        inner
                                            .replace(
                                                /&gt;/g,
                                                ">",
                                            )
                                            .replace(
                                                /&lt;/g,
                                                "<",
                                            )
                                            .replace(
                                                /&amp;/g,
                                                "&",
                                            ) +
                                        "$$"
                                    );
                                },
                            );
                            text = text.replace(
                                /\$([^$]+)\$/g,
                                function (m, inner) {
                                    return (
                                        "$" +
                                        inner
                                            .replace(
                                                /&gt;/g,
                                                ">",
                                            )
                                            .replace(
                                                /&lt;/g,
                                                "<",
                                            )
                                            .replace(
                                                /&amp;/g,
                                                "&",
                                            ) +
                                        "$"
                                    );
                                },
                            );
                            if (text !== node.nodeValue) {
                                node.nodeValue = text;
                            }
                        }
                    }
                    // Fix underscores inside \text{} — LaTeX requires \_ but authors often write _
                    var fixTextUnderscores = function (el) {
                        var walker2 =
                            document.createTreeWalker(
                                el,
                                NodeFilter.SHOW_TEXT,
                                null,
                                false,
                            );
                        while (walker2.nextNode()) {
                            var n = walker2.currentNode;
                            if (
                                n.nodeValue &&
                                /\\text\{/.test(n.nodeValue)
                            ) {
                                var fixed =
                                    n.nodeValue.replace(
                                        /\\text\{([^}]*)\}/g,
                                        function (
                                            m,
                                            inner,
                                        ) {
                                            return (
                                                "\\text{" +
                                                inner.replace(
                                                    /_/g,
                                                    "\\_",
                                                ) +
                                                "}"
                                            );
                                        },
                                    );
                                if (fixed !== n.nodeValue)
                                    n.nodeValue = fixed;
                            }
                        }
                    };
                    fixTextUnderscores(content);
                    // Now render math
                    if (
                        typeof renderMathInElement ===
                        "function"
                    ) {
                        renderMathInElement(content, {
                            delimiters: [
                                {
                                    left: "$$",
                                    right: "$$",
                                    display: true,
                                },
                                {
                                    left: "$",
                                    right: "$",
                                    display: false,
                                },
                            ],
                            ignoredTags: [
                                "script",
                                "noscript",
                                "style",
                                "textarea",
                                "pre",
                                "code",
                                "a",
                            ],
                            throwOnError: false,
                        });
                    }
                },
            );
        </script>
        <script>
            // Smooth page transition fallback for browsers without View Transitions API
            (function () {
                if (document.startViewTransition) return; // native support, no need for fallback
                document.addEventListener(
                    "click",
                    function (e) {
                        var link = e.target.closest("a");
                        if (!link || !link.href) return;
                        if (
                            link.target === "_blank" ||
                            link.hasAttribute("download")
                        )
                            return;
                        if (
                            e.ctrlKey ||
                            e.metaKey ||
                            e.shiftKey
                        )
                            return;
                        try {
                            var url = new URL(link.href);
                            if (
                                url.origin !==
                                location.origin
                            )
                                return;
                        } catch (err) {
                            return;
                        }
                        var content =
                            document.querySelector(
                                ".main-content",
                            );
                        if (!content) return;
                        e.preventDefault();
                        content.classList.add("navigating");
                        setTimeout(function () {
                            window.location.href =
                                link.href;
                        }, 150);
                    },
                );
            })();
        </script>
