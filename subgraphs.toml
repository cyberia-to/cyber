# Subgraph declarations for the cyber knowledge graph.
# Each entry declares one repository to include in the build.
#
# Fields:
#   name        — subgraph identifier; also the directory name under workspace root
#   parent      — URL parent namespace (mount = parent/name; absent = name alone)
#   mount       — explicit URL prefix override (rare; overrides parent+name derivation)
#   visibility  — "public" | "private" (default = "public")
#   archived    — true = exclude from build (default = false)
#   local-only  — true = exclude from public builds (default = false)
#   orphan      — true = repo vanished from org, exclude (default = false)


# /cyber ──────────────────────────────────

[[subgraph]]
name = "cyb"
parent = "cyber"
visibility = "public"

[[subgraph]]
name = "aos"
parent = "cyber"
visibility = "private"

