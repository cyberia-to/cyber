[package]
name = "true-cyber"
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
description = "Cyber node and local cyb integration over soft3"
repository = "https://github.com/cyberia-to/cyber"
license-file = "LICENSE"
publish = false

[[bin]]
name = "cyber"
path = "src/main.rs"

[dependencies]
soft3 = { path = "../soft3/crate", version = "0.10.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fs2 = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[workspace]
